[project]
name = "whatsapp-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "Satish Nande",email = "satishnande23@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12.8"
repository = "https://github.com/snande/whatsapp-bot"
keywords = [""]
dependencies = [
    "fastapi (>=0.128.4,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-dotenv (>=1.0.1,<2.0.0)"
]

[project.scripts]


[tool.poetry]
packages = [{include = "whatsapp_bot", from = "src"}]


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
mypy = "^1.19.1"
ruff = "^0.15.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "dist",
    "build",
    "docs",
]

[tool.ruff.lint]
extend-select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "D"]
ignore = []


[tool.ruff.lint.isort]
known-first-party = ["whatsapp_bot"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = false
suppress-none-returning = true
allow-star-arg-any = false
ignore-fully-untyped = false


[tool.mypy]
python_version = "3.12"
files = ["src/whatsapp_bot", "tests"]
strict = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]